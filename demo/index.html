<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bg-curve-remover demo</title>
    <style>
      :root {
        --bg-a: #e9f6ff;
        --bg-b: #ebfff2;
        --ink: #0f172a;
        --muted: #475569;
        --accent: #0060df;
        --line: #d9e2f1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 10% 20%, var(--bg-a), transparent 45%),
                    radial-gradient(circle at 90% 80%, var(--bg-b), transparent 45%),
                    #fff;
      }
      .wrap { max-width: 1120px; margin: 0 auto; padding: 2rem 1rem 3rem; }
      h1 { margin: 0 0 0.6rem; text-align: center; font-size: clamp(1.7rem, 3vw, 2.5rem); }
      .lead { text-align: center; color: var(--muted); margin: 0 auto 1.2rem; max-width: 720px; }

      .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .card { border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 0.75rem; }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
        margin: 0 0 0.55rem;
      }
      .card h3 { margin: 0; }

      .stage {
        width: 100%; min-height: 360px; display: grid; place-items: center;
        border-radius: 12px; position: relative; overflow: hidden;
        background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
                          linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
                          linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
                          linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      }
      .upload {
        border: 2px dashed #b8c7e6;
        transition: border-color .15s ease, background-color .15s ease;
        cursor: pointer;
      }
      .upload.drop-active { border-color: var(--accent); background-color: #eff6ff; }
      img { max-width: 100%; max-height: 520px; object-fit: contain; }
      .hint, .empty { color: var(--muted); text-align: center; padding: .5rem; }
      .status { margin: .9rem 0 .2rem; text-align: center; color: #334155; font-size: .95rem; }
      .btn {
        border: 0; background: var(--accent); color: #fff; padding: .58rem .9rem;
        border-radius: 10px; font-weight: 600; text-decoration: none; display: inline-flex;
        font-size: .88rem;
      }
      .loader {
        position: absolute; inset: 0; display: none; place-items: center;
        background: rgba(255,255,255,.84); backdrop-filter: blur(2px);
      }
      .loader.active { display: grid; }
      .spinner {
        width: 46px; height: 46px; border: 4px solid #dbeafe; border-top-color: var(--accent);
        border-radius: 50%; animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hidden { display: none !important; }
      @media (max-width: 840px) { .panes { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>bg-curve-remover</h1>
      <p class="lead">Upload on the left, get transparent result on the right. Processing starts automatically.</p>

      <input id="file" class="hidden" type="file" accept="image/*" />

      <section class="panes">
        <article class="card">
          <div class="card-head"><h3>Upload</h3></div>
          <div id="drop-zone" class="stage upload" role="button" tabindex="0" aria-label="Upload image">
            <img id="original" class="hidden" alt="Original preview" />
            <p id="hint" class="hint">Click or drag an image here</p>
            <div id="loader" class="loader"><div class="spinner"></div></div>
          </div>
          <p id="status" class="status">Choose an image to start.</p>
        </article>

        <article class="card">
          <div class="card-head">
            <h3>Preview</h3>
            <a id="download" class="btn hidden" download="cutout.webp">Download</a>
          </div>
          <div class="stage">
            <img id="result" class="hidden" alt="Background removed result" />
            <p id="result-empty" class="empty">Processed image will appear here</p>
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
