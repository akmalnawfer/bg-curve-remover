<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bg-curve-remover demo</title>
    <style>
      :root {
        --bg-a: #f5f7ff;
        --bg-b: #e7fff5;
        --ink: #0f172a;
        --accent: #1363df;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 10% 20%, var(--bg-a), transparent 45%),
                    radial-gradient(circle at 90% 80%, var(--bg-b), transparent 45%),
                    #fff;
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(1.6rem, 3vw, 2.4rem); }
      p { margin: 0 0 1rem; }
      .controls {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        margin: 1rem 0 1.5rem;
      }
      .btn {
        border: 0;
        background: var(--accent);
        color: #fff;
        padding: 0.65rem 1rem;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1rem;
      }
      .card {
        border: 1px solid #dbe2f5;
        border-radius: 16px;
        background: #fff;
        padding: 0.75rem;
      }
      .stage {
        width: 100%;
        min-height: 280px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        border: 2px dashed transparent;
        transition: border-color 0.15s ease, background-color 0.15s ease;
        background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%),
                          linear-gradient(-45deg, #f1f5f9 25%, transparent 25%),
                          linear-gradient(45deg, transparent 75%, #f1f5f9 75%),
                          linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      }
      .stage.drop-active {
        border-color: #1363df;
        background-color: #eff6ff;
      }
      .stage.clickable { cursor: pointer; }
      img { max-width: 100%; max-height: 420px; object-fit: contain; }
      #status { font-size: 0.95rem; color: #334155; }
      .hint {
        color: #475569;
        font-size: 0.9rem;
        text-align: center;
        padding: 0.5rem;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>bg-curve-remover demo</h1>
      <p>Click or drop an image in the Original panel. Background removal runs automatically.</p>
      <div class="controls">
        <a id="download" class="btn hidden" download="cutout.png">Download PNG</a>
      </div>
      <input id="file" class="hidden" type="file" accept="image/*" />
      <p id="status">Click the Original panel or drop an image there.</p>
      <section class="grid">
        <article class="card">
          <h3>Original</h3>
          <div id="drop-zone" class="stage clickable" role="button" tabindex="0" aria-label="Upload image">
            <img id="original" alt="Original preview" />
            <p id="drop-hint" class="hint">Click to upload or drag and drop image</p>
          </div>
        </article>
        <article class="card">
          <h3>Result</h3>
          <div class="stage">
            <img id="result" alt="Background removed result" />
          </div>
        </article>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
